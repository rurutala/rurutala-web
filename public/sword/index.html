<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101925">
    <meta name="robots" content="noindex, nofollow">
    <title>iPhone Sword Controller</title>
    <style>
        body { font: 17px system-ui, sans-serif; background: #101925; color: #eef5ff; max-width: 640px; margin: auto; padding: 24px; }
        h1 { font-size: 24px; } button { width: 100%; font: inherit; font-weight: 600; padding: 18px; margin: 8px 0; border: 0; border-radius: 10px; background: #7ee8df; color: #101925; touch-action: manipulation; }
        button:disabled { opacity: .4; } pre { white-space: pre-wrap; font-size: 14px; padding: 16px; background: #1d2c40; border-radius: 10px; overflow-wrap: anywhere; }
        p { line-height: 1.6; } #error { color: #ffb7a7; } .top { text-align: center; color: #7ee8df; font-weight: 700; }
    </style>
</head>
<body>
    <div class="top">↑ iPhoneの物理的な上端＝剣先 ↑</div>
    <h1>Sword Controller</h1>
    <p>PC?iPhone???Wi-Fi?????????????Wi-Fi????????????????</p>
    <p id="connection" role="status">接続準備中…</p>
    <button id="enable">センサーを許可して開始</button>
    <button id="calibrate" disabled>PCへ上端を向けてキャリブレーション</button>
    <p>画面を上にして、上端をPC画面へ水平に向けます。キャリブレーションを押したら0.6秒間静止してください。</p>
    <p>判定方向はプレイヤーから見た上下左右です。ガードは剣先の向きで決まります。</p>
    <p id="feedback" role="status">Unity側の接続を待っています。</p>
    <p id="error" role="alert"></p>
    <pre id="debug">センサー未開始</pre>
    <p>Safariを前面に保ち、スリープを解除してください。画面が回転しても剣先は物理的な上端です。</p>
    <script type="module" src="/sword/app.mjs"></script>
</body>
</html>
