<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <title>Sword | rurutala</title>
    <style>
        :root { color-scheme: light; background: #fff; color: #1e2f4a; font-family: system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 280px; min-height: 100svh; display: grid; place-items: center; background: #fff; }
        main { width: 100%; max-width: 440px; padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); display: grid; gap: 24px; }
        button { width: 100%; min-height: 64px; padding: 18px 16px; border: 0; border-radius: 6px; background: #1e2f4a; color: #fff; font: inherit; font-size: 16px; font-weight: 600; line-height: 1.6; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 1; cursor: default; }
        button:focus-visible { outline: 2px solid #1e2f4a; outline-offset: 4px; }
        button:active:not(:disabled) { background: #2a4166; }
        img { display: block; width: 100%; height: auto; }
    </style>
</head>
<body>
    <main>
        <button id="enable" type="button">センサーを許可して開始</button>
        <img src="/sword/calibration.webp" width="900" height="600" alt="iPhoneの画面を上にして持ち、物理的な上端をPC画面へ向けます。キャリブレーションを押したら0.6秒間静止します。">
        <button id="calibrate" type="button" disabled>PCへ上端を向けてキャリブレーション</button>
    </main>
    <script type="module" src="/sword/app.mjs"></script>
</body>
</html>
